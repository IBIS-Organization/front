<div class="recepcionista-container">
  <!-- Barra lateral -->
  <div class="sidebar">
    <img src="BLACK_IBIS.png" alt="Hotel Ibis Logo" class="logo" />
    <nav>
      <ul>
        <li>Principal</li>
        <li>Perfil</li>
        <li>Check in</li>
        <li>Check out</li>
      </ul>
    </nav>
  </div>

  <!-- Contenido principal -->
  <div class="main-content">
      <div class="header">
          <div class="header-content">
            <img src="https://cdn-icons-png.flaticon.com/512/30/30427.png" alt="Icono de Ficha Personal" class="header-icon" />
            <div class="header-text">
              <h2>FICHA PERSONAL</h2>
              <p>Recepcionista</p>
            </div>
          </div>
          <hr class="header-line" />
        </div>
        
    <form class="form">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">Nombre</label>
          <input type="text" id="firstName" placeholder="Ingrese su nombre" />
        </div>
        <div class="form-group">
          <label for="lastName">Apellido</label>
          <input type="text" id="lastName" placeholder="Ingrese su apellido" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
              <input [type]="showPassword ? 'text' : 'password'" id="password" placeholder="Ingrese su contraseña" />
              <span class="toggle-password" (click)="togglePasswordVisibility()">👁️</span>
            </div>
        </div>
        <div class="form-group">
          <label for="email">Correo</label>
          <input type="email" id="email" placeholder="Ingrese su correo" />
        </div>
      </div>
      <button class="edit-button" (click)="toggleEditMode()">
          {{ editMode ? 'Guardar' : 'Editar' }}
        </button>
    </form>
  </div>
</div>

<footer class="footer">
  2024 © Hotel Ibis - Trujillo_Grupo05 | Todos los derechos reservados
</footer>
