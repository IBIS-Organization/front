<div class="recepcionista-container">
    <!-- Sidebar -->
   
  
    <!-- Main Content -->
    <div class="main-content">
      <div class="header">
        <div class="header-content">
          <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Admin Icon" class="header-icon">
          <div class="header-text">
            <h2>ADMIN</h2>
          </div>
        </div>
        <hr class="header-line">
      </div>
      <form (ngSubmit)="changePassword()" #passwordForm="ngForm">
        <div class="form">
            <p>Por temas de seguridad cambie su contraseña actual</p>
            <div class="form-row">
              <div class="form-group">
                <label for="newPassword">Contraseña</label>
                <input
                    type="password"
                    id="newPassword"
                    [(ngModel)]="newPassword"
                    name="newPassword"
                    required
                    minlength="6"
                    #newPasswordField="ngModel"
                />
                <div *ngIf="newPasswordField.errors?.['minlength'] && newPasswordField.touched">
                    <p class="error-message">La contraseña debe ser de al menos 6 caracteres.</p>
                </div>
              </div>
              <div class="form-group">
                <label for="confirmPassword">Nueva Contraseña</label>
                <input
                    type="password"
                    id="confirmPassword"
                    [(ngModel)]="confirmPassword"
                    name="confirmPassword"
                    required
                    #confirmPasswordField="ngModel"
                />
                <div *ngIf="newPassword !== confirmPassword && confirmPasswordField.touched">
                    <p class="error-message">Las contraseñas no coinciden.</p>
                </div>
              </div>
            </div>
            <button class="edit-button" type="submit" 
            [disabled]="passwordForm.invalid" 
            [ngClass]="{'enabled': !passwordForm.invalid, 'disabled': passwordForm.invalid}">Guardar</button>
          </div>
      </form>
      
    </div>
  </div>
